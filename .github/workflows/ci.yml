name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the tests do not need to write anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      # Actions are pinned by commit hash, not by tag (Dependabot keeps them up to date).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run tests (includes presets.json validation)
        run: python -m unittest discover -s tests -v
